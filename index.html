<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Readiness Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1f33;--navy2:#1e3a57;--gold:#f5a623;--gold2:#e8c56a;--bg:#f8f5ef;--card:#fff;--ink:#1c2733;--mute:#687585;--line:#e4dfd3;--green:#2e7d5b;--alex:#1b3a5f;--eric:#8a5a12;--both:#5b4a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:16px}
#gate form{background:var(--card);border-radius:14px;padding:28px;width:100%;max-width:380px}
#gate h1{font-size:24px;color:var(--navy);margin-bottom:6px}
#gate p{margin:0 0 16px;color:var(--mute);font-size:14px}
#gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:12px}
#gate button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:600}
#gateErr{color:#a23434;font-size:14px;min-height:20px;margin-top:10px}

/* sticky progress */
#top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 0 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#top h1{font-size:20px}
#pct{font-family:"Playfair Display",serif;font-size:30px;color:var(--gold2);line-height:1}
#count{font-size:14px;color:#c8d3df}
.bar{height:14px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:10px 0 10px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .35s ease}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;color:#c8d3df}
.mini .bar{height:6px;margin:4px 0 0}
.mini b{color:#fff;font-weight:600}

.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:14px;margin:18px 0 12px}
.meta b{color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;background:#e9e5da;border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--mute);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.link{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--navy);font-weight:500}
#banner{display:none;background:#fff7e0;border:1px solid var(--gold2);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px}
#banner button{margin:8px 8px 0 0;border:1px solid var(--navy);border-radius:7px;padding:6px 12px;background:var(--navy);color:#fff;font-size:14px}
#banner button.alt{background:none;color:var(--navy)}

section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h2{font-size:18px;color:var(--navy)}
.sh span{font-size:13px;color:var(--mute);white-space:nowrap}
.sh span.full{color:var(--green);font-weight:600}
label.item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f0ece2;cursor:pointer;align-items:flex-start}
label.item:last-child{border-bottom:0}
label.item:hover{background:#faf8f3}
label.item input{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;border:2px solid #b9b3a4;border-radius:6px;margin:1px 0 0;background:#fff;cursor:pointer;position:relative}
label.item input:checked{background:var(--green);border-color:var(--green)}
label.item input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
label.item input:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.body{flex:1;min-width:0}
.txt{font-weight:500}
.note{font-size:13.5px;color:var(--mute);margin-top:2px}
.done .txt{color:var(--mute);text-decoration:line-through;font-weight:400}
.who{flex:0 0 auto;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;color:#fff;margin-top:1px}
.who.A{background:var(--alex)}.who.E{background:var(--eric)}.who.B{background:var(--both)}
.empty{padding:16px;color:var(--mute);font-size:14px}
footer{color:var(--mute);font-size:13px;margin:22px 0 40px}
footer button{border:0;background:none;color:var(--navy2);text-decoration:underline;padding:0;font-size:13px}
@media (max-width:520px){.link{margin-left:0}#top h1{font-size:17px}#pct{font-size:26px}}
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Readiness Checklist</h1>
    <p>Enter the passcode to open the checklist.</p>
    <input id="pw" type="password" aria-label="Passcode" placeholder="Passcode" autofocus>
    <button type="submit" id="gateBtn">Open</button>
    <div id="gateErr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <div id="top">
    <div class="wrap">
      <div class="toprow">
        <h1>SOC 2 Type 1 Readiness</h1>
        <div><span id="pct">0%</span> <span id="count"></span></div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barBox"><div id="bar"></div></div>
      <div class="mini">
        <div><b>Alex</b> <span id="cA"></span><div class="bar"><div id="bA"></div></div></div>
        <div><b>Eric</b> <span id="cE"></span><div class="bar"><div id="bE"></div></div></div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="meta">
      <span>Target date: <b id="target"></b></span>
      <span><b id="days"></b></span>
      <span>Starting point last updated: <b id="updated"></b></span>
    </div>
    <div id="banner"></div>
    <div class="controls">
      <div class="seg" id="segWho" role="group" aria-label="Filter by person">
        <button data-v="all" aria-pressed="true">Everyone</button>
        <button data-v="A" aria-pressed="false">Alex</button>
        <button data-v="E" aria-pressed="false">Eric</button>
      </div>
      <div class="seg" id="segSt" role="group" aria-label="Filter by status">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="todo" aria-pressed="false">To do</button>
        <button data-v="done" aria-pressed="false">Done</button>
      </div>
      <button class="link" id="share">Copy link with my progress</button>
    </div>
    <div id="list"></div>
    <footer>
      Ticks are saved in this browser. To show the other person where you are, use "Copy link with my progress" and send them the link.
      <br><button id="reset">Reset my ticks to the starting point</button>
    </footer>
  </div>
</div>

  var LS = 'aa-soc2-ticks-v1', LSP = 'aa-soc2-pass-v1';

  async function unlock(pass){

    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.s), iterations:BLOB.i, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);

      start();
    } catch(e){

    }

    var e = stats(function(i){ return i.o==='E' || i.o==='B'; });
    $('cA').textContent = a.n + ' of ' + a.total; $('bA').style.width = a.pct + '%';
    $('cE').textContent = e.n + ' of ' + e.total; $('bE').style.width = e.pct + '%';
  }

  var WHO = {A:'Alex', E:'Eric', B:'Both'};
  function render(){
    renderProgress();
    var list = $('list'); list.textContent = '';
    var shown = 0;
    data.sections.forEach(function(s){
      var vis = s.items.filter(function(it){
        var w = fWho==='all' || it.o===fWho || it.o==='B';
        var st = fSt==='all' || (fSt==='done') === isDone(it);
        return w && st;
      });
      if (!vis.length) return;
      shown += vis.length;
      var sec = document.createElement('section');
      var sh = document.createElement('div'); sh.className = 'sh';
      var h = document.createElement('h2'); h.textContent = s.t;
      var c = document.createElement('span');
      var dn = s.items.filter(isDone).length;
      c.textContent = dn + ' of ' + s.items.length + ' done';
      if (dn === s.items.length) c.className = 'full';
      sh.appendChild(h); sh.appendChild(c); sec.appendChild(sh);
      vis.forEach(function(it){
        var l = document.createElement('label'); l.className = 'item' + (isDone(it) ? ' done' : '');
        var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = isDone(it);
        cb.addEventListener('change', function(){ ticks[it.id] = cb.checked; save(); render(); });
        var body = document.createElement('div'); body.className = 'body';
        var t = document.createElement('div'); t.className = 'txt'; t.textContent = it.x; body.appendChild(t);
        if (it.n){ var n = document.createElement('div'); n.className = 'note'; n.textContent = it.n; body.appendChild(n); }
        var w = document.createElement('span'); w.className = 'who ' + it.o; w.textContent = WHO[it.o];
        l.appendChild(cb); l.appendChild(body); l.appendChild(w); sec.appendChild(l);
      });
      list.appendChild(sec);
    });
    if (!shown){ var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing matches these filters.'; list.appendChild(e); }
  }

  function seg(id, set){
    $(id).addEventListener('click', function(ev){
      var b = ev.target.closest('button'); if (!b) return;
      [].forEach.call($(id).children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      set(b.getAttribute('data-v')); render();
    });
  }
  function wire(){
    seg('segWho', function(v){ fWho = v; });
    seg('segSt', function(v){ fSt = v; });
    $('share').addEventListener('click', function(){
      var url = location.origin + location.pathname + '#p-' + encodeState(), btn = $('share');
      function ok(){ btn.textContent = 'Link copied'; setTimeout(function(){ btn.textContent = 'Copy link with my progress'; }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function(){ location.hash = 'p-' + encodeState(); });
      else location.hash = 'p-' + encodeState();
    });
    var armed = false;
    $('reset').addEventListener('click', function(){
      if (!armed){ armed = true; this.textContent = 'Click again to confirm the reset'; return; }
      armed = false; this.textContent = 'Reset my ticks to the starting point';
      ticks = {}; save(); render();
    });
  }

  $('gateForm').addEventListener('submit', function(ev){ ev.preventDefault(); tryOpen($('pw').value, false); });
  var saved = lsGet(LSP);
  if (saved) tryOpen(saved, true);
})();
</script>
</body>
</html>
